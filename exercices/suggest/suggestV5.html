<!-- Version 5: Couche d'informations effectives 
Flux fournit par une lecture de la base de données
Mise en cache coté client afin de limiter la charge du réseau
-->

<head>
    <script src="js/ajax.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        var cache = {
            currentSuggestions: [],
            lastRequests: {}
        };

        function traitement(reponseduServeur) {

            //  Les données sont envoyés au format JSON, il faut les
            //  parcourir et les afficher
            // console.log(reponseduServeur); // type: string
            //  le navigateur reçoit une chaine de caractères qu'il ne sait pas traiter
            //  il ignore la structure qui s'y cache

            //  il faudra reconvertir le texte bruit en données au format JSON
            // pour que  sa structure soit comprise et traiter ainsi

            var oJSON = JSON.parse(reponseduServeur)
            // console.log(oJSON); // type: object

            // Mise en cache
            cache.currentSuggestions = oJSON.suggestions;
            cache.lastRequests[oJSON.debutNom] = oJSON.suggestions;
            // console.log(cache);

            var affichage = "";

            for (var i = 0; i < oJSON.suggestions.length; i++) {
                affichage += "<li id='" + i + "'>"
                    + oJSON.suggestions[i].prenom
                    + " "
                    + oJSON.suggestions[i].nom.substr(0, 1) + "."
                    + "</li>";
            }

            html("suggestions", affichage);
            show("suggestions");
            hide("imgLoad");
        }

        function saisir() {
            var texte = val("saisie");
            show("imgLoad");
            hide("suggestions");
            ajax({
                // type: ,
                url: "data_bdd.php",
                data: { debutNom: texte },
                callback: traitement
            });
        }

        function choisir(ctx) {
            var iCache = ctx.target.id;
            var oMeta = cache.currentSuggestions[iCache];
            var cFinale = oMeta.prenom
                + " "
                + oMeta.nom.substr(0, 1)
                + ". ("
                + oMeta.id
                + ")";


            val("saisie", cFinale);
            hide("suggestions");
        }

        function annuler(ctx) {
            if (ctx.code == "Escape") {
                val("saisie", "");
                hide("imgLoad");
                hide("suggestions");
            }
        }
    </script>

    <style>
        #conteneur {
            position: relative;
            display: inline;
        }

        #saisie {
            width: 250px;
            height: 30px;
            padding-right: 20px;
            outline: none;
            border: 1px solid black;
        }

        #imgLoad {
            position: absolute;
            right: 7px;
            top: 8px;
            display: none;
        }

        #suggestions {
            position: absolute;
            border: 1px solid black;
            border-top: 0;
            padding: 0;
            margin: 0;
            left: 0;
            width: 248px;
            top: 25px;
            display: none;
        }

        #suggestions li {
            display: block;
            padding: 3px;
        }

        #suggestions li:hover {
            background-color: lightgrey;
            cursor: pointer;
        }
    </style>
</head>

<body onkeyup="annuler(event);">
    Bienvenue sur W2 suggest
    <div id="conteneur">
        <input type="text" id="saisie" onkeyup="saisir();" />
        <img src="ressources/ajaxLoader2.gif" id="imgLoad" />
        <ul id="suggestions" onclick="choisir(event);">
        </ul>
    </div>
</body>
